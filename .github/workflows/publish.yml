#
# On a published GitHub Release: gate on the full test suite (ci.yml), build the sdist +
# wheel, and attach them to the Release. VGI workers are not published to PyPI; users
# install from the GitHub Release (or the ghcr.io image).
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Run the same unit + extension-integration suite as on push/PR, so a release
  # can't publish without the worker passing against the real vgi extension.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build + attach distributions
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach assets to the Release
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        run: ci/check-version.sh "${{ github.event.release.tag_name }}"
      - name: Build wheel and sdist
        run: uv build --sdist --wheel --out-dir dist .
      - name: Attach distributions to the Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
