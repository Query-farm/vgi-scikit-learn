[project]
name = "vgi-sklearn"
# Single-sourced from vgi_sklearn/__init__.py (see [tool.hatch.version]) so the
# published wheel, the version the worker advertises over VGI
# (implementation_version / data_version), and the GitHub Release tag are always
# the same number. Bump __version__ there before tagging a release.
dynamic = ["version"]
description = "A VGI (Vector Gateway Interface) worker exposing scikit-learn datasets, metrics, transforms, and a train/predict model registry to DuckDB/SQL"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rusty Conover", email = "rusty@query.farm" }]
maintainers = [{ name = "Query Farm LLC", email = "hello@query.farm" }]
keywords = ["vgi", "duckdb", "arrow", "scikit-learn", "machine-learning", "sql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
requires-python = ">=3.13"
dependencies = [
    "vgi-python[http]>=0.50.0",
    "scikit-learn>=1.5",
    "numpy",
    "skops>=0.11",
]

[project.optional-dependencies]
# HTTP-serving extras. Sentry telemetry and OAuth auth only apply to the HTTP
# server (under stdio, DuckDB owns the pipe), so they live here rather than in
# the base deps: the published Docker image installs `.[serve]`, while a plain
# `pip install vgi-sklearn` for an on-host stdio worker stays lean.
serve = [
    "vgi-python[http,oauth]>=0.50.0",
    "vgi-rpc[sentry]>=0.53.1",
    "authlib",
]

# Console scripts. `vgi-sklearn` runs the stdio transport (DuckDB spawns it);
# `vgi-sklearn-http` runs the HTTP server. Once installed you can launch either
# directly, e.g. `uvx vgi-sklearn`.
[project.scripts]
vgi-sklearn = "vgi_sklearn.worker:main"
vgi-sklearn-http = "vgi_sklearn.worker:main_http"

[project.urls]
Homepage = "https://query.farm"
Repository = "https://github.com/Query-farm/vgi-scikit-learn"
Issues = "https://github.com/Query-farm/vgi-scikit-learn/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Read the package version from the `__version__` literal in the package itself,
# so it is the single source of truth (see [project].dynamic above).
[tool.hatch.version]
path = "vgi_sklearn/__init__.py"

# The installable worker is the `vgi_sklearn` package (entry points live in
# vgi_sklearn.worker). The repo-root sklearn_worker.py / serve.py are dev/Fly
# shims and intentionally not shipped in the wheel.
[tool.hatch.build.targets.wheel]
packages = ["vgi_sklearn"]

[tool.hatch.build.targets.sdist]
include = [
    "vgi_sklearn/",
    "sklearn_worker.py",
    "serve.py",
    "conftest.py",
    "tests/",
    "test/",
    "ci/",
    "assets/",
    "README.md",
    "CLAUDE.md",
    "LICENSE",
]

[dependency-groups]
dev = [
    "pytest",
    "pyarrow",
    "ruff",
    "pydoclint",
    "mypy",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "D"]
ignore = [
    "E741",  # ambiguous variable name (x, y are conventional in ML)
    "B008",  # function call in argument default (Arg(...) defaults are intentional)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are not part of the documented public surface: skip docstring rules.
"tests/*" = ["E402", "D"]

[tool.ruff.format]
quote-style = "double"

[tool.pydoclint]
# Docstring consistency gate (complements ruff's `D` rules, which only check
# docstring *shape*, not whether documented args/attributes match the code).
# Mirrors the vgi-python settings. Run via `uv run pydoclint vgi_sklearn/
# sklearn_worker.py serve.py`; also enforced inside the pytest suite by
# tests/test_docstrings.py.
style = "google"
# Types live in signatures, not docstrings (Google style).
arg_type_hints_in_docstring = false
check_return_types = false
check_yield_types = false
# Validate that an `Attributes:` section matches the actual dataclass fields.
check_class_attributes = true
# Raises are documented indirectly; don't gate on DOC5xx.
skip_checking_raises = true
# Document constructor params in the class docstring, not __init__.
allow_init_docstring = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# The scientific stack ships no (or partial) type information; don't fail on
# missing stubs for these third-party imports.
module = ["sklearn.*", "scipy.*", "skops.*", "joblib.*", "pandas.*"]
ignore_missing_imports = true


[tool.vgi-lint-check.execution]
# Serialize the execution probes (VGI9xx). A bare-command LOCATION serves one query
# per worker process, so probing ~150 objects concurrently cold-starts that many
# Python interpreters at once, each importing scikit-learn/scipy; on a small CI
# runner that thundering herd -- not any slow scan -- pushes probes past the 10s
# scan timeout (VGI911). One at a time measures each scan against a single cold
# start; no rule is waived and the timeout is unchanged.
concurrency = 1

[tool.vgi-lint-check.options]
# VGI205/VGI315: these names follow scikit-learn's own parameter/column naming,
# where the same word means different things in different estimators, so one
# shared type would be wrong:
#   target       - INTEGER class label (classification datasets), DOUBLE value
#                  (regression datasets), VARCHAR label-column name (list_models).
#   max_features - BIGINT vocabulary cap (count/tfidf vectorizers), DOUBLE feature
#                  fraction (bagging), VARCHAR split strategy (forests).
#   norm         - BOOLEAN "normalize weights" (ComplementNB), VARCHAR norm name
#                  (Normalizer).
#   y_true       - DOUBLE for numeric metrics, BIGINT/VARCHAR labels elsewhere.
#   estimator    - VARCHAR estimator name (fit/cross_val_*), UNION grid
#                  (grid_search/randomized_search).
type_consistency_ignore_names = ["target", "max_features", "norm", "y_true", "estimator"]

[tool.vgi-lint-check.per_object]
# VGI901/902 (--execute only) run each example's SQL live. These functions read a
# *stored* model/transformer at bind time, so their single-statement illustrative
# examples cannot bind in a fresh session (no model exists yet) — the fit->predict
# workflow is demonstrated in the catalog's vgi.executable_examples instead. This
# is a surgical, documented exception scoped to exactly the model-dependent
# functions; every other example binds and runs on real/inline data.
"sklearn.models.predict" = { ignore = [{ code = "VGI911", kind = "domain-exemption", reason = "The scan probe replays this function's example, which reads a model/transformer stored by an earlier fit; a fresh lint session has none, so it cannot bind. The fit->predict workflow runs in the catalog vgi.executable_examples." }, { code = "VGI901", kind = "domain-exemption", reason = "VGI901/902 (--execute only) run each example's SQL live. These functions read a *stored* model/transformer at bind time, so their single-statement illustrative examples cannot bind in a fresh session (no model exists yet) — the fit->predict workflow is demonstrated in the catalog's vgi.executable..." }, { code = "VGI902", kind = "domain-exemption", reason = "VGI901/902 (--execute only) run each example's SQL live. These functions read a *stored* model/transformer at bind time, so their single-statement illustrative examples cannot bind in a fresh session (no model exists yet) — the fit->predict workflow is demonstrated in the catalog's vgi.executable..." }] }
