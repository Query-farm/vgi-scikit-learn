"sklearn.preprocessing.apply_transform" = { ignore = [{ code = "VGI911", kind = "domain-exemption", reason = "The scan probe replays this function's example, which reads a model/transformer stored by an earlier fit; a fresh lint session has none, so it cannot bind. The fit->predict workflow runs in the catalog vgi.executable_examples." }, { code = "VGI901", kind = "domain-exemption", reason = "VGI901/902 (--execute only) run each example's SQL live. These functions read a *stored* model/transformer at bind time, so their single-statement illustrative examples cannot bind in a fresh session (no model exists yet) — the fit->predict workflow is demonstrated in the catalog's vgi.executable..." }, { code = "VGI902", kind = "domain-exemption", reason = "VGI901/902 (--execute only) run each example's SQL live. These functions read a *stored* model/transformer at bind time, so their single-statement illustrative examples cannot bind in a fresh session (no model exists yet) — the fit->predict workflow is demonstrated in the catalog's vgi.executable..." }] }
"sklearn.models.list_models" = { ignore = [{ code = "VGI142", kind = "domain-exemption", reason = "Renaming would break the published SQL API: list_models/list_transformers are documented, used in README/tests, and mirror the model_info/drop_model registry verbs; the plain-table form is already queryable without parentheses." }] }
"sklearn.preprocessing.list_transformers" = { ignore = [{ code = "VGI142", kind = "domain-exemption", reason = "Renaming would break the published SQL API: list_models/list_transformers are documented, used in README/tests, and mirror the model_info/drop_model registry verbs; the plain-table form is already queryable without parentheses." }] }
"sklearn.models.grid_search" = { ignore = [{ code = "VGI316", kind = "domain-exemption", reason = "The estimator+grid is one discriminated UNION of per-estimator STRUCTs of value lists (scikit-learn's param_grid), built with union_value(); a relation input would lose the per-estimator typing that makes the grid discoverable via vgi_function_arguments()." }] }
"sklearn.models.randomized_search" = { ignore = [{ code = "VGI316", kind = "domain-exemption", reason = "The estimator+grid is one discriminated UNION of per-estimator STRUCTs of value lists (scikit-learn's param_grid), built with union_value(); a relation input would lose the per-estimator typing that makes the grid discoverable via vgi_function_arguments()." }] }
