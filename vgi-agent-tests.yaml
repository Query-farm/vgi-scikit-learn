# Private graders for `vgi-lint simulate` (VGI416). The worker publishes only
# task names and prompts in the catalog's vgi.agent_test_tasks tag
# (vgi_sklearn/agent_tasks.py); these canonical solutions and grading options
# stay in the repo and are merged by task name. Every catalog object is called
# by at least one reference_sql (VGI520).
tasks:
  - name: iris_species_counts
    reference_sql: "SELECT target_name, count(*) AS n FROM sklearn.datasets.iris GROUP BY target_name"
    unordered: true
  - name: toy_dataset_sizes
    reference_sql: "SELECT 'wine' AS dataset, count(*) AS n FROM sklearn.datasets.wine() UNION ALL SELECT 'digits' AS dataset, count(*) AS n FROM sklearn.datasets.digits() UNION ALL SELECT 'breast_cancer' AS dataset, count(*) AS n FROM sklearn.datasets.breast_cancer() UNION ALL SELECT 'diabetes' AS dataset, count(*) AS n FROM sklearn.datasets.diabetes() UNION ALL SELECT 'california_housing' AS dataset, count(*) AS n FROM sklearn.datasets.california_housing()"
    unordered: true
  - name: synthetic_dataset_sizes
    reference_sql: "SELECT 'classification' AS generator, count(*) AS n FROM sklearn.datasets.make_classification(n_samples => 120, random_state => 0) UNION ALL SELECT 'regression', count(*) FROM sklearn.datasets.make_regression(n_samples => 120, random_state => 0) UNION ALL SELECT 'blobs', count(*) FROM sklearn.datasets.make_blobs(n_samples => 120, random_state => 0) UNION ALL SELECT 'moons', count(*) FROM sklearn.datasets.make_moons(n_samples => 120, random_state => 0) UNION ALL SELECT 'circles', count(*) FROM sklearn.datasets.make_circles(n_samples => 120, random_state => 0)"
    unordered: true
    ignore_column_names: true
  - name: inline_r2_score
    reference_sql: "SELECT round(sklearn.metrics.r2_score(actual, predicted), 4) AS r2 FROM (VALUES (3.0, 2.5), (5.0, 5.1), (7.0, 6.8), (9.0, 9.4)) AS t(actual, predicted)"
    ignore_column_names: true
  - name: regression_error_metrics
    reference_sql: "SELECT round(sklearn.metrics.mean_absolute_error(actual, predicted), 4) AS mean_absolute_error, round(sklearn.metrics.mean_squared_error(actual, predicted), 4) AS mean_squared_error, round(sklearn.metrics.root_mean_squared_error(actual, predicted), 4) AS root_mean_squared_error, round(sklearn.metrics.median_absolute_error(actual, predicted), 4) AS median_absolute_error, round(sklearn.metrics.max_error(actual, predicted), 4) AS max_error, round(sklearn.metrics.explained_variance_score(actual, predicted), 4) AS explained_variance_score, round(sklearn.metrics.mean_absolute_percentage_error(actual, predicted), 4) AS mean_absolute_percentage_error, round(sklearn.metrics.mean_squared_log_error(actual, predicted), 4) AS mean_squared_log_error, round(sklearn.metrics.mean_pinball_loss(actual, predicted), 4) AS mean_pinball_loss FROM (VALUES (3.0, 2.5), (5.0, 5.1), (7.0, 6.8), (9.0, 9.4)) AS t(actual, predicted)"
    ignore_column_names: true
  - name: inline_accuracy
    reference_sql: "SELECT round(sklearn.metrics.accuracy_score(y, yhat), 2) AS accuracy FROM (VALUES (0, 0), (1, 1), (1, 0), (0, 0), (1, 1)) AS t(y, yhat)"
    ignore_column_names: true
  - name: binary_label_metrics
    reference_sql: "SELECT round(sklearn.metrics.balanced_accuracy_score(y, yhat), 4) AS balanced_accuracy_score, round(sklearn.metrics.precision_score(y, yhat), 4) AS precision_score, round(sklearn.metrics.recall_score(y, yhat), 4) AS recall_score, round(sklearn.metrics.f1_score(y, yhat), 4) AS f1_score, round(sklearn.metrics.jaccard_score(y, yhat), 4) AS jaccard_score, round(sklearn.metrics.matthews_corrcoef(y, yhat), 4) AS matthews_corrcoef, round(sklearn.metrics.cohen_kappa_score(y, yhat), 4) AS cohen_kappa_score, round(sklearn.metrics.hamming_loss(y, yhat), 4) AS hamming_loss, round(sklearn.metrics.zero_one_loss(y, yhat), 4) AS zero_one_loss FROM (VALUES (0, 0), (1, 1), (1, 0), (0, 0), (1, 1), (0, 1)) AS t(y, yhat)"
    ignore_column_names: true
  - name: probability_metrics
    reference_sql: "SELECT round(sklearn.metrics.roc_auc_score(y, p), 4) AS roc_auc_score, round(sklearn.metrics.average_precision_score(y, p), 4) AS average_precision_score, round(sklearn.metrics.brier_score_loss(y, p), 4) AS brier_score_loss, round(sklearn.metrics.log_loss(y, p), 4) AS log_loss FROM (VALUES (0, 0.1), (1, 0.9), (0, 0.4), (1, 0.6), (1, 0.35), (0, 0.2)) AS t(y, p)"
    ignore_column_names: true
  - name: cluster_agreement_metrics
    reference_sql: "SELECT round(sklearn.metrics.adjusted_rand_score(truth, cluster), 4) AS adjusted_rand_score, round(sklearn.metrics.adjusted_mutual_info_score(truth, cluster), 4) AS adjusted_mutual_info_score, round(sklearn.metrics.normalized_mutual_info_score(truth, cluster), 4) AS normalized_mutual_info_score, round(sklearn.metrics.homogeneity_score(truth, cluster), 4) AS homogeneity_score, round(sklearn.metrics.completeness_score(truth, cluster), 4) AS completeness_score, round(sklearn.metrics.v_measure_score(truth, cluster), 4) AS v_measure_score, round(sklearn.metrics.fowlkes_mallows_score(truth, cluster), 4) AS fowlkes_mallows_score FROM (VALUES (0, 1), (0, 1), (1, 0), (1, 0), (2, 2), (2, 1)) AS t(truth, cluster)"
    ignore_column_names: true
  - name: confusion_matrix_cells
    reference_sql: "SELECT actual, predicted, count FROM sklearn.metrics.confusion_matrix((SELECT * FROM (VALUES (0, 0), (1, 1), (1, 0), (0, 0), (1, 1), (0, 1)) AS t(y, yhat)), actual := 'y', predicted := 'yhat')"
    unordered: true
    ignore_column_names: true
  - name: curve_point_counts
    reference_sql: "SELECT 'roc' AS curve, count(*) AS n FROM sklearn.metrics.roc_curve((SELECT * FROM (VALUES (0, 0.1), (1, 0.9), (0, 0.4), (1, 0.6), (1, 0.35), (0, 0.2)) AS t(y, p)), y_true := 'y', y_score := 'p') UNION ALL SELECT 'precision_recall', count(*) FROM sklearn.metrics.precision_recall_curve((SELECT * FROM (VALUES (0, 0.1), (1, 0.9), (0, 0.4), (1, 0.6), (1, 0.35), (0, 0.2)) AS t(y, p)), y_true := 'y', y_score := 'p') UNION ALL SELECT 'calibration', count(*) FROM sklearn.metrics.calibration_curve((SELECT * FROM (VALUES (0, 0.1), (1, 0.9), (0, 0.4), (1, 0.6), (1, 0.35), (0, 0.2)) AS t(y, p)), y_true := 'y', y_score := 'p', n_bins := 5)"
    unordered: true
    ignore_column_names: true
  - name: silhouette_of_two_clusters
    reference_sql: "SELECT round(silhouette_score, 3) AS silhouette FROM sklearn.metrics.silhouette_score((SELECT * FROM (VALUES (1, 0.1::DOUBLE, 0.2::DOUBLE, 0), (2, 0.2, 0.1, 0), (3, 5.0, 5.1, 1), (4, 5.1, 5.0, 1)) AS clustered(id, x1, x2, cluster)), label => 'cluster', id => 'id')"
    ignore_column_names: true
  - name: sepal_length_after_scaling
    reference_sql: "SELECT 'standard_scaler' AS step, round(max(sepal_length_cm), 3) AS max_sepal_length FROM sklearn.preprocessing.standard_scaler((SELECT sample_id, sepal_length_cm, sepal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id') UNION ALL SELECT 'minmax_scaler' AS step, round(max(sepal_length_cm), 3) AS max_sepal_length FROM sklearn.preprocessing.minmax_scaler((SELECT sample_id, sepal_length_cm, sepal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id') UNION ALL SELECT 'robust_scaler' AS step, round(max(sepal_length_cm), 3) AS max_sepal_length FROM sklearn.preprocessing.robust_scaler((SELECT sample_id, sepal_length_cm, sepal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id') UNION ALL SELECT 'maxabs_scaler' AS step, round(max(sepal_length_cm), 3) AS max_sepal_length FROM sklearn.preprocessing.maxabs_scaler((SELECT sample_id, sepal_length_cm, sepal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id') UNION ALL SELECT 'normalizer' AS step, round(max(sepal_length_cm), 3) AS max_sepal_length FROM sklearn.preprocessing.normalizer((SELECT sample_id, sepal_length_cm, sepal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id') UNION ALL SELECT 'power_transformer' AS step, round(max(sepal_length_cm), 3) AS max_sepal_length FROM sklearn.preprocessing.power_transformer((SELECT sample_id, sepal_length_cm, sepal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id') UNION ALL SELECT 'quantile_transformer' AS step, round(max(sepal_length_cm), 3) AS max_sepal_length FROM sklearn.preprocessing.quantile_transformer((SELECT sample_id, sepal_length_cm, sepal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id', n_quantiles := 100) UNION ALL SELECT 'binarizer' AS step, round(max(sepal_length_cm), 3) AS max_sepal_length FROM sklearn.preprocessing.binarizer((SELECT sample_id, sepal_length_cm, sepal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id', threshold := 5.0) UNION ALL SELECT 'kbins_discretizer' AS step, round(max(sepal_length_cm), 3) AS max_sepal_length FROM sklearn.preprocessing.kbins_discretizer((SELECT sample_id, sepal_length_cm, sepal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id', n_bins := 4) UNION ALL SELECT 'simple_imputer' AS step, round(max(sepal_length_cm), 3) AS max_sepal_length FROM sklearn.preprocessing.simple_imputer((SELECT sample_id, sepal_length_cm, sepal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id')"
    unordered: true
    ignore_column_names: true
  - name: polynomial_interaction_term
    reference_sql: "SELECT round(max(sepal_length_cm_x_sepal_width_cm), 2) AS max_interaction FROM sklearn.preprocessing.polynomial_features((SELECT sample_id, sepal_length_cm, sepal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id', degree := 2)"
    ignore_column_names: true
  - name: species_encodings
    reference_sql: "SELECT 'ordinal' AS encoder, count(DISTINCT target_name) AS n FROM sklearn.preprocessing.ordinal_encoder((SELECT sample_id, target_name FROM sklearn.datasets.iris()), id := 'sample_id') UNION ALL SELECT 'one_hot', count(DISTINCT category) FROM sklearn.preprocessing.one_hot_encoder((SELECT sample_id, target_name FROM sklearn.datasets.iris()), id := 'sample_id') UNION ALL SELECT 'target', count(DISTINCT round(target_name, 6)) FROM sklearn.preprocessing.target_encoder((SELECT sample_id, target_name, (target = 0)::INTEGER AS is_setosa FROM sklearn.datasets.iris()), id := 'sample_id', target := 'is_setosa')"
    unordered: true
    ignore_column_names: true
  - name: embedding_row_counts
    reference_sql: "SELECT 'pca' AS method, count(component_2) AS n FROM sklearn.preprocessing.pca((SELECT sample_id, sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id', n_components := 2) UNION ALL SELECT 'truncated_svd' AS method, count(component_2) AS n FROM sklearn.preprocessing.truncated_svd((SELECT sample_id, sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id', n_components := 2) UNION ALL SELECT 'tsne' AS method, count(component_2) AS n FROM sklearn.preprocessing.tsne((SELECT sample_id, sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id', n_components := 2) UNION ALL SELECT 'isomap' AS method, count(component_2) AS n FROM sklearn.preprocessing.isomap((SELECT sample_id, sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id', n_components := 2) UNION ALL SELECT 'spectral_embedding' AS method, count(component_2) AS n FROM sklearn.preprocessing.spectral_embedding((SELECT sample_id, sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id', n_components := 2) UNION ALL SELECT 'mds' AS method, count(component_2) AS n FROM sklearn.preprocessing.mds((SELECT sample_id, sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id', n_components := 2)"
    unordered: true
    ignore_column_names: true
  - name: iris_kmeans_cluster_sizes
    reference_sql: "SELECT count(*) AS n FROM sklearn.preprocessing.kmeans((SELECT sample_id, sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id', n_clusters := 3) GROUP BY cluster ORDER BY n DESC"
    ignore_column_names: true
  - name: clustering_label_counts
    reference_sql: "SELECT 'agglomerative_clustering' AS method, count(DISTINCT cluster) AS n FROM sklearn.preprocessing.agglomerative_clustering((SELECT sample_id, sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id', n_clusters := 3) UNION ALL SELECT 'spectral_clustering' AS method, count(DISTINCT cluster) AS n FROM sklearn.preprocessing.spectral_clustering((SELECT sample_id, sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id', n_clusters := 3) UNION ALL SELECT 'birch' AS method, count(DISTINCT cluster) AS n FROM sklearn.preprocessing.birch((SELECT sample_id, sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id', n_clusters := 3) UNION ALL SELECT 'minibatch_kmeans' AS method, count(DISTINCT cluster) AS n FROM sklearn.preprocessing.minibatch_kmeans((SELECT sample_id, sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id', n_clusters := 3) UNION ALL SELECT 'gaussian_mixture' AS method, count(DISTINCT cluster) AS n FROM sklearn.preprocessing.gaussian_mixture((SELECT sample_id, sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id', n_components := 3) UNION ALL SELECT 'mean_shift' AS method, count(DISTINCT cluster) AS n FROM sklearn.preprocessing.mean_shift((SELECT sample_id, sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id') UNION ALL SELECT 'dbscan' AS method, count(DISTINCT cluster) AS n FROM sklearn.preprocessing.dbscan((SELECT sample_id, sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id', eps := 0.5) UNION ALL SELECT 'optics' AS method, count(DISTINCT cluster) AS n FROM sklearn.preprocessing.optics((SELECT sample_id, sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id', min_samples := 5)"
    unordered: true
    ignore_column_names: true
  - name: outlier_counts
    reference_sql: "SELECT 'isolation_forest' AS detector, sum(is_outlier) AS n FROM sklearn.preprocessing.isolation_forest((SELECT sample_id, sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id', contamination := 0.1) UNION ALL SELECT 'local_outlier_factor' AS detector, sum(is_outlier) AS n FROM sklearn.preprocessing.local_outlier_factor((SELECT sample_id, sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id', contamination := 0.1) UNION ALL SELECT 'one_class_svm' AS detector, sum(is_outlier) AS n FROM sklearn.preprocessing.one_class_svm((SELECT sample_id, sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id', nu := 0.1) UNION ALL SELECT 'elliptic_envelope' AS detector, sum(is_outlier) AS n FROM sklearn.preprocessing.elliptic_envelope((SELECT sample_id, sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id', contamination := 0.1)"
    unordered: true
    ignore_column_names: true
  - name: text_vocabulary
    reference_sql: "SELECT (SELECT sum(value) FROM sklearn.preprocessing.count_vectorizer((SELECT * FROM (VALUES (1, 'the cat sat on the mat'), (2, 'the dog sat on the log'), (3, 'a quick brown fox')) AS docs(id, body)), id := 'id', text := 'body') WHERE term = 'the') AS the_count, (SELECT term FROM sklearn.preprocessing.tfidf_vectorizer((SELECT * FROM (VALUES (1, 'the cat sat on the mat'), (2, 'the dog sat on the log'), (3, 'a quick brown fox')) AS docs(id, body)), id := 'id', text := 'body') WHERE id = 3 ORDER BY value DESC, term LIMIT 1) AS top_term"
    ignore_column_names: true
  - name: selected_iris_features
    reference_sql: "SELECT 'k_best' AS method, feature FROM sklearn.preprocessing.select_k_best((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), target := 'target', k := 2) WHERE selected UNION ALL SELECT 'variance', feature FROM sklearn.preprocessing.variance_threshold((SELECT sample_id, sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id', threshold := 0.5) WHERE selected"
    unordered: true
    ignore_column_names: true
  - name: classifier_training_accuracy
    reference_sql: "SELECT estimator, round(train_score, 2) AS train_accuracy FROM sklearn.estimators.fit_ada_boost_classifier((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), target := 'target') UNION ALL SELECT estimator, round(train_score, 2) AS train_accuracy FROM sklearn.estimators.fit_bagging_classifier((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), target := 'target') UNION ALL SELECT estimator, round(train_score, 2) AS train_accuracy FROM sklearn.estimators.fit_bernoulli_nb((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), target := 'target') UNION ALL SELECT estimator, round(train_score, 2) AS train_accuracy FROM sklearn.estimators.fit_complement_nb((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), target := 'target') UNION ALL SELECT estimator, round(train_score, 2) AS train_accuracy FROM sklearn.estimators.fit_decision_tree_classifier((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), target := 'target') UNION ALL SELECT estimator, round(train_score, 2) AS train_accuracy FROM sklearn.estimators.fit_extra_trees_classifier((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), target := 'target') UNION ALL SELECT estimator, round(train_score, 2) AS train_accuracy FROM sklearn.estimators.fit_gaussian_nb((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), target := 'target') UNION ALL SELECT estimator, round(train_score, 2) AS train_accuracy FROM sklearn.estimators.fit_gradient_boosting_classifier((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), target := 'target') UNION ALL SELECT estimator, round(train_score, 2) AS train_accuracy FROM sklearn.estimators.fit_hist_gradient_boosting_classifier((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), target := 'target') UNION ALL SELECT estimator, round(train_score, 2) AS train_accuracy FROM sklearn.estimators.fit_knn_classifier((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), target := 'target') UNION ALL SELECT estimator, round(train_score, 2) AS train_accuracy FROM sklearn.estimators.fit_lda((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), target := 'target') UNION ALL SELECT estimator, round(train_score, 2) AS train_accuracy FROM sklearn.estimators.fit_linear_svc((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), target := 'target') UNION ALL SELECT estimator, round(train_score, 2) AS train_accuracy FROM sklearn.estimators.fit_logistic_regression((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), target := 'target') UNION ALL SELECT estimator, round(train_score, 2) AS train_accuracy FROM sklearn.estimators.fit_mlp_classifier((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), target := 'target') UNION ALL SELECT estimator, round(train_score, 2) AS train_accuracy FROM sklearn.estimators.fit_multinomial_nb((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), target := 'target') UNION ALL SELECT estimator, round(train_score, 2) AS train_accuracy FROM sklearn.estimators.fit_qda((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), target := 'target') UNION ALL SELECT estimator, round(train_score, 2) AS train_accuracy FROM sklearn.estimators.fit_random_forest_classifier((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), target := 'target') UNION ALL SELECT estimator, round(train_score, 2) AS train_accuracy FROM sklearn.estimators.fit_ridge_classifier((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), target := 'target') UNION ALL SELECT estimator, round(train_score, 2) AS train_accuracy FROM sklearn.estimators.fit_sgd_classifier((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), target := 'target') UNION ALL SELECT estimator, round(train_score, 2) AS train_accuracy FROM sklearn.estimators.fit_svc((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), target := 'target')"
    unordered: true
    ignore_column_names: true
  - name: regressor_training_r2
    reference_sql: "SELECT estimator, round(train_score, 2) AS train_r2 FROM sklearn.estimators.fit_ada_boost_regressor((SELECT * FROM sklearn.datasets.diabetes()), target := 'target', id := 'sample_id') UNION ALL SELECT estimator, round(train_score, 2) AS train_r2 FROM sklearn.estimators.fit_bagging_regressor((SELECT * FROM sklearn.datasets.diabetes()), target := 'target', id := 'sample_id') UNION ALL SELECT estimator, round(train_score, 2) AS train_r2 FROM sklearn.estimators.fit_bayesian_ridge((SELECT * FROM sklearn.datasets.diabetes()), target := 'target', id := 'sample_id') UNION ALL SELECT estimator, round(train_score, 2) AS train_r2 FROM sklearn.estimators.fit_decision_tree_regressor((SELECT * FROM sklearn.datasets.diabetes()), target := 'target', id := 'sample_id') UNION ALL SELECT estimator, round(train_score, 2) AS train_r2 FROM sklearn.estimators.fit_elastic_net((SELECT * FROM sklearn.datasets.diabetes()), target := 'target', id := 'sample_id') UNION ALL SELECT estimator, round(train_score, 2) AS train_r2 FROM sklearn.estimators.fit_extra_trees_regressor((SELECT * FROM sklearn.datasets.diabetes()), target := 'target', id := 'sample_id') UNION ALL SELECT estimator, round(train_score, 2) AS train_r2 FROM sklearn.estimators.fit_gamma_regressor((SELECT * FROM sklearn.datasets.diabetes()), target := 'target', id := 'sample_id') UNION ALL SELECT estimator, round(train_score, 2) AS train_r2 FROM sklearn.estimators.fit_gradient_boosting_regressor((SELECT * FROM sklearn.datasets.diabetes()), target := 'target', id := 'sample_id') UNION ALL SELECT estimator, round(train_score, 2) AS train_r2 FROM sklearn.estimators.fit_hist_gradient_boosting_regressor((SELECT * FROM sklearn.datasets.diabetes()), target := 'target', id := 'sample_id') UNION ALL SELECT estimator, round(train_score, 2) AS train_r2 FROM sklearn.estimators.fit_huber_regressor((SELECT * FROM sklearn.datasets.diabetes()), target := 'target', id := 'sample_id') UNION ALL SELECT estimator, round(train_score, 2) AS train_r2 FROM sklearn.estimators.fit_knn_regressor((SELECT * FROM sklearn.datasets.diabetes()), target := 'target', id := 'sample_id') UNION ALL SELECT estimator, round(train_score, 2) AS train_r2 FROM sklearn.estimators.fit_lasso((SELECT * FROM sklearn.datasets.diabetes()), target := 'target', id := 'sample_id') UNION ALL SELECT estimator, round(train_score, 2) AS train_r2 FROM sklearn.estimators.fit_linear_regression((SELECT * FROM sklearn.datasets.diabetes()), target := 'target', id := 'sample_id') UNION ALL SELECT estimator, round(train_score, 2) AS train_r2 FROM sklearn.estimators.fit_linear_svr((SELECT * FROM sklearn.datasets.diabetes()), target := 'target', id := 'sample_id') UNION ALL SELECT estimator, round(train_score, 2) AS train_r2 FROM sklearn.estimators.fit_mlp_regressor((SELECT * FROM sklearn.datasets.diabetes()), target := 'target', id := 'sample_id') UNION ALL SELECT estimator, round(train_score, 2) AS train_r2 FROM sklearn.estimators.fit_poisson_regressor((SELECT * FROM sklearn.datasets.diabetes()), target := 'target', id := 'sample_id') UNION ALL SELECT estimator, round(train_score, 2) AS train_r2 FROM sklearn.estimators.fit_quantile_regressor((SELECT * FROM sklearn.datasets.diabetes()), target := 'target', id := 'sample_id') UNION ALL SELECT estimator, round(train_score, 2) AS train_r2 FROM sklearn.estimators.fit_random_forest_regressor((SELECT * FROM sklearn.datasets.diabetes()), target := 'target', id := 'sample_id') UNION ALL SELECT estimator, round(train_score, 2) AS train_r2 FROM sklearn.estimators.fit_ridge((SELECT * FROM sklearn.datasets.diabetes()), target := 'target', id := 'sample_id') UNION ALL SELECT estimator, round(train_score, 2) AS train_r2 FROM sklearn.estimators.fit_sgd_regressor((SELECT * FROM sklearn.datasets.diabetes()), target := 'target', id := 'sample_id') UNION ALL SELECT estimator, round(train_score, 2) AS train_r2 FROM sklearn.estimators.fit_svr((SELECT * FROM sklearn.datasets.diabetes()), target := 'target', id := 'sample_id') UNION ALL SELECT estimator, round(train_score, 2) AS train_r2 FROM sklearn.estimators.fit_tweedie_regressor((SELECT * FROM sklearn.datasets.diabetes()), target := 'target', id := 'sample_id')"
    unordered: true
    ignore_column_names: true
  - name: iris_cv_accuracy
    reference_sql: "SELECT round(avg(score), 2) AS mean_accuracy FROM sklearn.models.cross_val_score((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), estimator := 'logistic_regression', target := 'target', cv := 3)"
    ignore_column_names: true
  - name: out_of_fold_accuracy
    reference_sql: "SELECT round(avg((p.prediction = i.target)::INTEGER), 2) AS oof_accuracy FROM sklearn.models.cross_val_predict((SELECT sample_id, sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), estimator := 'logistic_regression', target := 'target', id := 'sample_id') p JOIN sklearn.datasets.iris i USING (sample_id)"
    ignore_column_names: true
  - name: cv_split_sizes
    reference_sql: "SELECT 'kfold' AS method, count(*) AS n FROM sklearn.models.kfold((SELECT sample_id FROM sklearn.datasets.iris()), id := 'sample_id', n_splits := 5) WHERE fold = 0 UNION ALL SELECT 'stratified', count(*) FROM sklearn.models.stratified_kfold((SELECT sample_id, target FROM sklearn.datasets.iris()), id := 'sample_id', label := 'target', n_splits := 5) WHERE fold = 0 UNION ALL SELECT 'group', count(*) FROM sklearn.models.group_kfold((SELECT sample_id, target AS grp FROM sklearn.datasets.iris()), id := 'sample_id', group_col := 'grp', n_splits := 3) WHERE fold = 0 UNION ALL SELECT 'timeseries', count(*) FROM sklearn.models.timeseries_split((SELECT sample_id FROM sklearn.datasets.iris() ORDER BY sample_id), id := 'sample_id', n_splits := 5) WHERE split = 0 AND role = 'test'"
    unordered: true
    ignore_column_names: true
  - name: stored_model_accuracy
    reference_sql:
      - "SELECT model_name FROM sklearn.models.fit((SELECT sample_id, sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), model_name := 'agent_iris_rf', estimator := 'random_forest_classifier', target := 'target', id := 'sample_id')"
      - "SELECT round(avg((p.prediction = i.target)::INTEGER), 2) AS accuracy FROM sklearn.models.predict((SELECT * FROM sklearn.datasets.iris()), model_name := 'agent_iris_rf', id := 'sample_id') p JOIN sklearn.datasets.iris i USING (sample_id)"
    ignore_column_names: true
  - name: most_important_feature
    reference_sql:
      - "SELECT model_name FROM sklearn.models.fit((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), model_name := 'agent_iris_rf_pi', estimator := 'random_forest_classifier', target := 'target')"
      - "SELECT feature FROM sklearn.models.permutation_importance((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), model_name := 'agent_iris_rf_pi', target := 'target') ORDER BY importance_mean DESC LIMIT 1"
    ignore_column_names: true
  - name: bmi_partial_dependence
    reference_sql:
      - "SELECT model_name FROM sklearn.models.fit((SELECT * FROM sklearn.datasets.diabetes()), model_name := 'agent_diabetes_rf', estimator := 'random_forest_regressor', target := 'target', id := 'sample_id')"
      - "SELECT arg_max(partial_dependence, feature_value) > arg_min(partial_dependence, feature_value) AS rises FROM sklearn.models.partial_dependence((SELECT * EXCLUDE (sample_id, target) FROM sklearn.datasets.diabetes()), model_name := 'agent_diabetes_rf', feature := 'bmi', grid_resolution := 10)"
    ignore_column_names: true
  - name: model_registry_lifecycle
    reference_sql:
      - "SELECT model_name FROM sklearn.models.fit((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), model_name := 'agent_tmp_model', estimator := 'logistic_regression', target := 'target')"
      - "SELECT count(*) AS listed FROM sklearn.models.list_models() WHERE model_name = 'agent_tmp_model'"
      - "SELECT n_features FROM sklearn.models.model_info('agent_tmp_model')"
      - "SELECT dropped FROM sklearn.models.drop_model('agent_tmp_model')"
    ignore_column_names: true
  - name: scaled_pca_pipeline
    reference_sql: "SELECT round(train_score, 2) AS train_accuracy FROM sklearn.models.fit_pipeline((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), steps := '[{\"kind\": \"standard_scaler\"}, {\"kind\": \"pca\", \"params\": {\"n_components\": 2}}]', estimator := 'logistic_regression', target := 'target')"
    ignore_column_names: true
  - name: forest_hyperparameter_search
    reference_sql: "SELECT 'grid' AS search, round(max(mean_test_score), 2) AS best FROM sklearn.models.grid_search((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), target := 'target', estimator := union_value(random_forest_classifier := {'n_estimators': [50, 100], 'max_depth': [2, 4]})) UNION ALL SELECT 'randomized', round(max(mean_test_score), 2) FROM sklearn.models.randomized_search((SELECT sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm, target FROM sklearn.datasets.iris()), target := 'target', n_iter := 3, random_state := 0, estimator := union_value(random_forest_classifier := {'n_estimators': [50, 100], 'max_depth': [2, 4]}))"
    unordered: true
    ignore_column_names: true
  - name: per_region_churn_models
    reference_sql: "WITH customers AS (SELECT * FROM (VALUES ('east', 12, 30.0, 0), ('east', 3, 80.0, 1), ('east', 8, 45.0, 0), ('east', 2, 95.0, 1), ('west', 24, 20.0, 0), ('west', 1, 90.0, 1), ('west', 18, 35.0, 0), ('west', 4, 85.0, 1)) AS customers(region, tenure, spend, churned)), models AS (SELECT region, sklearn.models.fit_model({'tenure': tenure, 'spend': spend}, churned, 'logistic_regression', '{}') AS m FROM customers GROUP BY region) SELECT c.region, sum(sklearn.models.predict_one(m.m.model, {'tenure': c.tenure, 'spend': c.spend})) AS n_churn, count(sklearn.models.predict_class_one(m.m.model, {'tenure': c.tenure, 'spend': c.spend})) AS n_scored, round(avg(list_last(sklearn.models.predict_proba_one(m.m.model, {'tenure': c.tenure, 'spend': c.spend}))), 1) AS avg_p FROM customers c JOIN models m USING (region) GROUP BY c.region"
    unordered: true
    ignore_column_names: true
  - name: stored_scaler_roundtrip
    reference_sql:
      - "SELECT transformer_name FROM sklearn.preprocessing.fit_transformer((SELECT sepal_length_cm, sepal_width_cm FROM sklearn.datasets.iris()), transformer_name := 'agent_sc', kind := 'standard_scaler')"
      - "SELECT round(avg(sepal_length_cm), 6) AS mean_scaled FROM sklearn.preprocessing.apply_transform((SELECT * FROM sklearn.datasets.iris()), transformer_name := 'agent_sc', id := 'sample_id')"
      - "SELECT count(*) AS listed FROM sklearn.preprocessing.list_transformers() WHERE transformer_name = 'agent_sc'"
      - "SELECT dropped FROM sklearn.preprocessing.drop_transformer('agent_sc')"
    ignore_column_names: true
  - name: wine_knn_misclassified_per_cultivar
    reference_sql: "SELECT w.target, count(*) FILTER (WHERE p.prediction <> w.target) AS misclassified FROM sklearn.models.cross_val_predict((SELECT * EXCLUDE (target_name) FROM sklearn.datasets.wine()), estimator := 'knn_classifier', target := 'target', id := 'sample_id', cv := 5) AS p JOIN sklearn.datasets.wine AS w USING (sample_id) GROUP BY w.target ORDER BY w.target"
    ignore_column_names: true
  - name: scaled_ward_cluster_species_agreement
    reference_sql: "WITH scaled AS (SELECT * FROM sklearn.preprocessing.standard_scaler((SELECT sample_id, sepal_length_cm, sepal_width_cm, petal_length_cm, petal_width_cm FROM sklearn.datasets.iris()), id := 'sample_id')) SELECT round(sklearn.metrics.adjusted_rand_score(i.target, c.cluster), 3) AS adjusted_rand FROM sklearn.preprocessing.agglomerative_clustering((SELECT * FROM scaled), id := 'sample_id', n_clusters := 3, linkage := 'ward') AS c JOIN sklearn.datasets.iris AS i USING (sample_id)"
    ignore_column_names: true
